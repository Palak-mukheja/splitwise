
services:
  db:
    image: postgres:16
    
    environment:
      POSTGRES_DB: spliteasy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - 15ed8c1a7405e6dde72062354872402fe6024716d0dfe0396285a9a99c1eeb7c:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spliteasy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:dev@db:5432/spliteasy
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-development-only-change-me}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  15ed8c1a7405e6dde72062354872402fe6024716d0dfe0396285a9a99c1eeb7c:
    external: true
